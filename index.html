<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img src="logo.png" alt="" />
        <h1>AUCHI POLYTECHNIC AUCHI</h1>
      </header>
      <div class="reg-form">
        <h1>REGISTRATION FORM</h1>
        <form action="register.php" method="post">
          <div>
            <label for="">First Name:</label>
            <input type="text" name="first_name" required class="name" />
          </div>

          <div>
            <label for="">Last Name:</label>
            <input type="text" name="last_name" required class="name"/>
          </div>

          <div>
            <label for="">Matric Number:</label>
            <input type="text" name="matric_number" required class="matric"/>
          </div>

          <div>
            <label for="">Address:</label>
            <textarea type="text" name="address" id="" class="address" required cols="50" rows="50"></textarea>
          </div>

          <div>
            <label for="">Date of Birth:</label>
            <input type="date" name="dob" required class="dob"/>
          </div>

          <div>
            <label for="">State:</label>
            <input type="text" name="state" required class="state"/>
          </div>

          <div>
            <label for="">Phone Number:</label>
            <input type="text" name="phone_number" required class="number"/>
          </div>


          <div>
            <label for="">Email Address:</label>
            <input type="text" name="email" required class="email"/>
          </div>

          <div>
            <label for="">Sex:</label>
            <select name="sex" id="" class="sex">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div>
            <label>Departmet:</label>
            <input type="text" name="departmet" required class="dept"/>
          </div>

          <div>
            <label>Next of Kin</label>
            <input type="text" name="next_kin" class="next"/>
          </div>

          <div>
            <label for="">Mode of Study</label>
            <select name="mode" id="" class="mode">
              <option value="morning">Morning</option>
              <option value="evening">Evening</option>
            </select>
          </div>

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
