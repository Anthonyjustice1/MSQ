<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img src="logo.png" alt="" />
        <h1>AUCHI POLYTECHNIC AUCHI</h1>
      </header>
      <div class="reg-form">
        <h1>REGISTRATION FORM</h1>
        <form action="">
          <div>
            <label for="">First Name:</label>
            <input type="text" name="first_name" required />
          </div>

          <div>
            <label for="">Last Name:</label>
            <input type="text" name="last_name" required />
          </div>

          <div>
            <label for="">Matric Number:</label>
            <input type="text" name="matric_number" required />
          </div>

          <div>
            <label for="">Address:</label>
            <input type="text" name="Address" required />
          </div>

          <!-- <div>
            <label for="">Address:</label>
            <input type="text" name="Address" required />
          </div> -->

          <div>
            <label for="">Date of Birth:</label>
            <input type="date" name="dob" required />
          </div>

          <div>
            <label for="">State:</label>
            <input type="text" name="state" required />
          </div>

          <div>
            <label for="">Phone Number:</label>
            <input type="text" name="phonne_number" required />
          </div>

          <div>
            <label for="">Address:</label>
            <input type="text" name="Address" required />
          </div>

          <div>
            <label for="">Email Address:</label>
            <input type="text" name="email" required />
          </div>

          <div>
            <label for="">Sex:</label>
            <select name="sex" id="">
              <!-- <option value=""></option> -->
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div>
            <label>Departmet:</label>
            <input type="text" name="departmet" required />
          </div>

          <div>
            <label>Next of Kin</label>
            <input type="text" name="next_kin" />
          </div>

          <div>
            <label>Mode of Study</label>
            <input type="text" name="mode_study" />
          </div>

          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
